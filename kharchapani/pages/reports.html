<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KharchaPane — Reports</title>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/nepali-date-converter/dist/nepali-date-converter.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand"><span class="brand-icon-sm">₨</span><span class="brand-name">KharchaPane</span></div>
      <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
    </div>
    <div class="sidebar-user">
      <div class="user-avatar" id="user-avatar">H</div>
      <div class="user-info"><div class="user-name" id="user-name">Loading...</div><div class="user-email" id="user-email"></div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">◉</span><span class="nav-label">Dashboard</span></a>
      <a href="expenses.html" class="nav-item"><span class="nav-icon">↗</span><span class="nav-label">Expenses</span></a>
      <a href="income.html" class="nav-item"><span class="nav-icon">↙</span><span class="nav-label">Income</span></a>
      <div class="nav-section-label">Analysis</div>
      <a href="reports.html" class="nav-item active"><span class="nav-icon">📊</span><span class="nav-label">Reports</span></a>
      <a href="budget.html" class="nav-item"><span class="nav-icon">🎯</span><span class="nav-label">Budget Goals</span></a>
      <div class="nav-section-label">Account</div>
      <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></a>
      <button class="nav-item nav-btn" id="logout-btn"><span class="nav-icon">⏏</span><span class="nav-label">Sign Out</span></button>
    </nav>
    <div class="sidebar-footer">
      <div class="nepali-date-display" id="today-nepali"></div>
      <div class="ad-date-display" id="today-ad"></div>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
        <div class="page-title">
          <h1>Reports</h1>
          <p class="page-subtitle">Financial overview & insights</p>
        </div>
      </div>
      <div class="topbar-right">
        <select id="report-year" class="filter-select"></select>
      </div>
    </header>

    <div class="content-body">
      <!-- Yearly Summary -->
      <div class="summary-cards">
        <div class="summary-card income-card">
          <div class="card-icon">↙</div>
          <div class="card-body">
            <div class="card-label">Annual Income</div>
            <div class="card-amount" id="annual-income">₨ 0</div>
          </div>
        </div>
        <div class="summary-card expense-card">
          <div class="card-icon">↗</div>
          <div class="card-body">
            <div class="card-label">Annual Expenses</div>
            <div class="card-amount" id="annual-expenses">₨ 0</div>
          </div>
        </div>
        <div class="summary-card balance-card">
          <div class="card-icon">⚖</div>
          <div class="card-body">
            <div class="card-label">Annual Savings</div>
            <div class="card-amount" id="annual-savings">₨ 0</div>
          </div>
        </div>
      </div>

      <!-- Monthly Bar Chart -->
      <div class="section-card">
        <div class="section-header"><h3>Monthly Income vs Expenses</h3></div>
        <canvas id="monthly-bar-chart" style="max-height:320px"></canvas>
      </div>

      <!-- Category Breakdown Table -->
      <div class="section-card">
        <div class="section-header"><h3>Expense by Category (Annual)</h3></div>
        <div id="category-breakdown-table"></div>
      </div>
    </div>
  </main>
</div>

<script src="../js/supabase-config.js"></script>
<script src="../js/nepali-date.js"></script>
<script src="../js/categories.js"></script>
<script src="../js/app.js"></script>
<script src="../js/reports.js"></script>
</body>
</html>
