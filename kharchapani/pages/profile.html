<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KharchaPane — Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/nepali-date-converter/dist/nepali-date-converter.umd.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand"><span class="brand-icon-sm">₨</span><span class="brand-name">KharchaPane</span></div>
      <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
    </div>
    <div class="sidebar-user">
      <div class="user-avatar" id="user-avatar">H</div>
      <div class="user-info"><div class="user-name" id="user-name">Loading...</div><div class="user-email" id="user-email"></div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">◉</span><span class="nav-label">Dashboard</span></a>
      <a href="expenses.html" class="nav-item"><span class="nav-icon">↗</span><span class="nav-label">Expenses</span></a>
      <a href="income.html" class="nav-item"><span class="nav-icon">↙</span><span class="nav-label">Income</span></a>
      <div class="nav-section-label">Analysis</div>
      <a href="reports.html" class="nav-item"><span class="nav-icon">📊</span><span class="nav-label">Reports</span></a>
      <a href="budget.html" class="nav-item"><span class="nav-icon">🎯</span><span class="nav-label">Budget Goals</span></a>
      <div class="nav-section-label">Account</div>
      <a href="profile.html" class="nav-item active"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></a>
      <button class="nav-item nav-btn" id="logout-btn"><span class="nav-icon">⏏</span><span class="nav-label">Sign Out</span></button>
    </nav>
    <div class="sidebar-footer">
      <div class="nepali-date-display" id="today-nepali"></div>
      <div class="ad-date-display" id="today-ad"></div>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
        <div class="page-title">
          <h1>Profile</h1>
          <p class="page-subtitle">Account settings</p>
        </div>
      </div>
    </header>

    <div class="content-body">
      <div class="section-card" style="max-width:500px">
        <div class="section-header"><h3>Personal Information</h3></div>

        <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)">
          <div id="profile-avatar" style="width:64px;height:64px;background:var(--primary);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700">H</div>
          <div>
            <div style="font-size:1.1rem;font-weight:600" id="profile-name">Loading...</div>
            <div style="font-size:0.85rem;color:var(--text-muted)" id="profile-email"></div>
          </div>
        </div>

        <form id="profile-form">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="pf-name" placeholder="Your full name"/>
          </div>
          <div class="form-group">
            <label>Email (read-only)</label>
            <input type="email" id="pf-email" readonly style="background:var(--bg);cursor:not-allowed"/>
          </div>
          <button type="submit" class="btn-primary" style="width:auto;padding:0.6rem 1.5rem">Update Profile</button>
          <div class="form-error" id="profile-msg"></div>
        </form>
      </div>

      <div class="section-card" style="max-width:500px">
        <div class="section-header"><h3>Change Password</h3></div>
        <form id="password-form">
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="new-password" placeholder="Min 6 characters"/>
          </div>
          <button type="submit" class="btn-primary" style="width:auto;padding:0.6rem 1.5rem">Update Password</button>
          <div class="form-error" id="password-msg"></div>
        </form>
      </div>

      <div class="section-card" style="max-width:500px">
        <div class="section-header"><h3>Data</h3></div>
        <p style="font-size:0.88rem;color:var(--text-secondary);margin-bottom:1rem">
          Your data is securely stored in Supabase. All expenses and income are private to your account.
        </p>
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap">
          <button onclick="exportData()" style="padding:0.55rem 1rem;background:var(--income-light);color:var(--income);border:none;border-radius:6px;cursor:pointer;font-family:var(--font);font-size:0.88rem;font-weight:500">📥 Export to CSV</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../js/supabase-config.js"></script>
<script src="../js/nepali-date.js"></script>
<script src="../js/categories.js"></script>
<script src="../js/app.js"></script>
<script>
async function initProfile() {
  const session = await initApp();
  if (!session) return;

  const user = session.user;
  const name = user.user_metadata?.full_name || '';
  const email = user.email || '';

  document.getElementById('profile-name').textContent = name || email;
  document.getElementById('profile-email').textContent = email;
  document.getElementById('profile-avatar').textContent = (name || email)[0].toUpperCase();
  document.getElementById('pf-name').value = name;
  document.getElementById('pf-email').value = email;

  document.getElementById('profile-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newName = document.getElementById('pf-name').value.trim();
    const { error } = await supabaseClient.auth.updateUser({ data: { full_name: newName } });
    const msg = document.getElementById('profile-msg');
    if (error) { msg.textContent = error.message; msg.style.color = 'var(--expense)'; }
    else { msg.textContent = '✅ Profile updated!'; msg.style.color = 'var(--income)'; }
  });

  document.getElementById('password-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('new-password').value;
    const msg = document.getElementById('password-msg');
    if (pw.length < 6) { msg.textContent = 'Password too short'; return; }
    const { error } = await supabaseClient.auth.updateUser({ password: pw });
    if (error) { msg.textContent = error.message; msg.style.color = 'var(--expense)'; }
    else { msg.textContent = '✅ Password updated!'; msg.style.color = 'var(--income)'; document.getElementById('new-password').value = ''; }
  });
}

async function exportData() {
  const { data } = await supabaseClient.from('transactions').select('*').eq('user_id', currentUser.id).order('date_ad');
  if (!data) return;

  const headers = ['Type','Date BS','Date AD','Particular','Category','Amount','Note'];
  const rows = data.map(t => [
    t.type, `${t.date_bs_day}/${t.date_bs_month}/${t.date_bs_year}`,
    t.date_ad, t.particular, t.category, t.amount, t.note || ''
  ]);

  const csv = [headers, ...rows].map(r => r.map(v => `"${v}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'kharchapane_export.csv'; a.click();
  showToast('Data exported!');
}

initProfile();
</script>
</body>
</html>
