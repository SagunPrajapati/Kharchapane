name: NEPSE Daily Scraper

on:
  schedule:
    - cron: '20 9 * * 1-5'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run floorsheet scraper
        run: python nepsealpha_floorsheet.py

      - name: Run master report scraper
        run: python nepse_scraper.py

      - name: Commit and push output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Add NEPSE data $(date +'%Y-%m-%d')"
          git push
